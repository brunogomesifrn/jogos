<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  :root{
    --sky:#bfe8ff; --sky2:#e6f6ff; --ink:#1d2a44; --white:#fff;
    --red:#ff5a3c; --orange:#ffa62b; --green:#4cc35e; --blue:#3d8bff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    font-family:"Baloo 2",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%,#d8f5c8 100%);
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .nuvem{position:fixed;z-index:0;opacity:.85;pointer-events:none;animation:flutua 40s linear infinite}
  .nuvem.n1{top:6%;left:-160px;width:150px}
  .nuvem.n2{top:22%;left:-220px;width:210px;animation-duration:60s;animation-delay:-25s}
  .nuvem.n3{top:60%;left:-180px;width:170px;animation-duration:52s;animation-delay:-12s}
  @keyframes flutua{to{transform:translateX(calc(100vw + 260px))}}

  header{position:relative;z-index:1;text-align:center;margin:8px auto 24px;max-width:900px}
  h1{
    margin:0;font-weight:800;line-height:1;
    font-size:clamp(2.6rem,9vw,4.6rem);
    color:var(--white);
    text-shadow:0 4px 0 var(--blue),0 8px 0 rgba(29,42,68,.18);
    letter-spacing:.5px;
  }
  header p{margin:12px 0 0;font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:600}

  main{
    position:relative;z-index:1;
    display:grid;gap:22px;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));
    max-width:1180px;margin:0 auto;
  }
  .jogo{
    --cor:var(--blue);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:22px 16px 20px;
    background:var(--white);
    border:5px solid var(--cor);
    border-radius:32px;
    box-shadow:0 10px 0 var(--cor),0 18px 30px rgba(29,42,68,.18);
    color:var(--ink);text-decoration:none;text-align:center;
    transition:transform .15s ease,box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .jogo:hover{transform:translateY(-6px) rotate(-1deg)}
  .jogo:active{transform:translateY(6px);box-shadow:0 4px 0 var(--cor),0 8px 16px rgba(29,42,68,.18)}
  .jogo:focus-visible{outline:6px solid var(--ink);outline-offset:6px}
  .icone{
    width:min(100%,190px);aspect-ratio:1;
    border-radius:50%;
    background:color-mix(in srgb,var(--cor) 18%,white);
    display:grid;place-items:center;
  }
  .icone svg{width:82%;height:82%}
  .jogo:hover .icone svg{animation:pula .6s ease}
  @keyframes pula{40%{transform:translateY(-10px) scale(1.06)}}
  .nome{font-size:clamp(1.5rem,4.6vw,1.9rem);font-weight:800;line-height:1.05}
  .desc{font-size:1.1rem;font-weight:600;line-height:1.25;opacity:.8}
  .jogar{
    margin-top:4px;padding:8px 30px;border-radius:999px;
    background:var(--cor);color:var(--white);
    font-size:1.35rem;font-weight:800;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  .bombeiro{--cor:var(--red)}
  .missoes{--cor:var(--orange)}
  .resgate{--cor:var(--green)}
  .penalti{--cor:var(--blue)}

  @media (prefers-reduced-motion:reduce){
    .nuvem,.jogo:hover .icone svg{animation:none}
    .jogo,.jogo:hover{transition:none;transform:none}
  }
</style>
</head>
<body>
