<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hércules Bombeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-bleed 3D world; avionics dashboard docked at the bottom; mission card + map at the top */
:root{
  --panel: rgba(16,26,36,.80);
  --panel-deep:#0a1218;
  --edge: rgba(150,185,205,.24);
  --ink:#e9f1f5;
  --muted:#93a8b5;
  --amber:#ffb53d;
  --nav:#4fd1e8;
  --iguana:#86cf45;
  --car:#9db4ff;
  --fruit:#ff8a3d;
  --urgent:#ff6b81;
  --fire:#ff5a3c;
  --forest:#ff9a2e;
  --water:#4fb6ff;
  --danger:#ff5a4e;
  --font-ui:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --font-num:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#8fc3e6;color:var(--ink);font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none}
#hud button,.throttle,#stick{pointer-events:auto}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--nav);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--edge);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(0,12,24,.28)}

/* ---- top ---- */
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px;fill:var(--ink)}
#mission{min-width:0;flex:0 1 350px;padding:8px 12px 9px;font-size:14px;line-height:1.25;display:flex;flex-direction:column;gap:3px}
.mrow{display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.1em;white-space:nowrap}
.chip svg{width:16px;height:16px;fill:currentColor}
.t-carga{background:rgba(255,181,61,.18);color:var(--amber)}
.t-carros{background:rgba(157,180,255,.2);color:var(--car)}
.t-iguanas{background:rgba(134,207,69,.2);color:var(--iguana)}
.t-frutas{background:rgba(255,138,61,.2);color:var(--fruit)}
.t-urgente{background:rgba(255,107,129,.2);color:var(--urgent)}
.t-livre{background:rgba(255,255,255,.1);color:var(--muted)}
.t-predio{background:rgba(255,90,60,.2);color:var(--fire)}
.t-floresta{background:rgba(255,154,46,.2);color:var(--forest)}
.t-agua{background:rgba(79,182,255,.2);color:var(--water)}
.meter{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em}
.meter>span:first-child{width:36px}
.meter .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;transition:width .2s}
.meter>span:last-child{font-family:var(--font-num);font-weight:400;min-width:62px;text-align:right}
.meter.fire{color:var(--fire)}.meter.fire i{background:var(--fire)}
.meter.water{color:var(--water)}.meter.water i{background:var(--water)}
#scoop{position:absolute;top:calc(21% + 42px);left:50%;transform:translateX(-50%);padding:6px 14px 8px;border-radius:10px;background:rgba(6,40,70,.88);border:1px solid var(--water);color:#e6f5ff;font-weight:800;letter-spacing:.08em;font-size:15px;text-align:center;min-width:240px;max-width:90vw;white-space:nowrap}
#scoop .bar{height:6px;margin-top:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#scoop .bar i{display:block;height:100%;background:var(--water);width:0}
#scoop.idle{background:var(--panel);border-color:var(--edge);color:#cfe6f5;font-weight:700;letter-spacing:.03em}
#scoop.idle .bar{display:none}
#mPay{margin-left:auto;font-family:var(--font-num);color:var(--ink);font-size:15px;white-space:nowrap}
#mDesc{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mRoute{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mRoute b{color:var(--ink);font-weight:600}
#mArrow{width:22px;height:22px;flex:none;transition:transform .15s linear}
#mArrow path{fill:var(--nav)}
#mDist{font-family:var(--font-num);color:var(--nav);white-space:nowrap}
#mStatus{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#mStatus .late{color:var(--danger)}
#mStatus .ok{color:var(--urgent)}
#welfare{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--iguana)}
#welfare .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#welfare .bar i{display:block;height:100%;width:100%;background:var(--iguana);transition:width .2s}
.spacer{flex:1}
#wallet{padding:6px 12px;text-align:right;flex:none;line-height:1.1}
#wallet b{font-family:var(--font-num);font-weight:400;font-size:20px;color:var(--amber)}
#wallet span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
#wallet small{display:block;color:var(--muted);font-size:12px;font-weight:600}
#minimap{width:124px;height:124px;flex:none;border-radius:12px;border:1px solid var(--edge);background:var(--panel-deep);display:block}

#toast{position:absolute;top:31%;left:50%;transform:translateX(-50%);max-width:min(90vw,480px);padding:9px 16px;border-radius:10px;font-weight:700;font-size:17px;text-align:center;opacity:0;transition:opacity .25s;background:var(--panel);border:1px solid var(--edge)}
#toast.show{opacity:1}
#toast.good{color:var(--iguana)}#toast.warn{color:var(--amber)}#toast.bad{color:var(--danger)}
#warn{position:absolute;top:21%;left:50%;transform:translateX(-50%);padding:5px 16px;border-radius:8px;background:rgba(120,10,6,.85);border:1px solid var(--danger);color:#fff;font-weight:800;letter-spacing:.14em;font-size:17px;animation:blink .7s steps(2) infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.35}}

/* ---- dashboard ---- */
#panel{position:absolute;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dash{display:flex;gap:8px;align-items:center;padding:8px;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.throttle{position:relative;width:54px;height:128px;border-radius:10px;background:linear-gradient(90deg,#0d161d,#1c2a35 50%,#0d161d);border:1px solid var(--edge);touch-action:none;overflow:hidden;flex:none}
.tfill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,rgba(255,181,61,.10),rgba(255,181,61,.42))}
.tslot{position:absolute;left:50%;top:8px;bottom:8px;width:4px;margin-left:-2px;border-radius:2px;background:#05090c}
.thandle{position:absolute;left:5px;right:5px;bottom:0;height:28px;border-radius:6px;background:linear-gradient(#f0f4f6,#93a5b0);color:#13202a;font:15px var(--font-num);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.tlabel{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.start{width:64px;height:64px;border-radius:50%;border:3px solid #2a343b;background:radial-gradient(circle at 50% 38%,#ef5146,#8a1b16);color:#fff;font-weight:800;font-size:14px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.35);padding:0}
.start small{font-size:9px;letter-spacing:.1em;font-weight:700;opacity:.85}
.start.on{background:radial-gradient(circle at 50% 38%,#62d36d,#1d7a2c)}
.start.busy{background:radial-gradient(circle at 50% 38%,#ffc65c,#a8650d)}
.sw{min-width:62px;height:40px;padding:3px 8px;border-radius:9px;background:#0d171e;border:1px solid var(--edge);font-weight:700;letter-spacing:.07em;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sw .led{width:22px;height:4px;border-radius:2px;background:#2e3c46}
.sw.on .led{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.sw.red.on .led{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.sw small{font:11px var(--font-num);color:var(--amber);letter-spacing:0}
.gauge{width:86px;height:86px;flex:none;display:block}
.digi{display:grid;grid-template-columns:auto auto;gap:1px 10px;background:var(--panel-deep);border:1px solid var(--edge);border-radius:8px;padding:6px 9px;min-width:124px}
.digi label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;align-self:center}
.digi b{font:400 17px var(--font-num);color:var(--amber);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.digi b.nav{color:var(--nav)}
.switches{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.right{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#stick{width:134px;height:134px;border-radius:50%;position:relative;touch-action:none;flex:none;background:radial-gradient(circle,#1e2c37 0 58%,#111b22 59%);border:2px solid var(--edge);box-shadow:0 6px 18px rgba(0,0,0,.35)}
#stick::before,#stick::after{content:"";position:absolute;background:rgba(150,185,205,.18)}
#stick::before{left:50%;top:12px;bottom:12px;width:1px}
#stick::after{top:50%;left:12px;right:12px;height:1px}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5b6b76,#19232a);border:2px solid #8396a2;z-index:1;display:grid;place-items:center}
#knob svg{width:34px;height:34px;stroke:#cfdbe2;fill:none;stroke-width:3;stroke-linecap:round}
.sticklbl{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);pointer-events:none}
#action{position:relative;overflow:hidden;padding:11px 20px;border-radius:999px;border:none;background:var(--iguana);color:#0e1c07;font-weight:800;letter-spacing:.1em;font-size:16px;box-shadow:0 0 0 0 rgba(134,207,69,.6);animation:pulse 1.5s infinite;white-space:nowrap}
#action.pick{background:var(--nav);color:#06222a;animation-name:pulse2}
#action.drop{background:var(--fruit);color:#2a1100;animation-name:pulse3}
#action.water{background:var(--water);color:#04213a;animation-name:pulse4;padding:14px 24px;font-size:17px;touch-action:none}
#action.water.pour{background:#e6f5ff;animation:none}
#action.water .prog{background:rgba(4,33,58,.18)}
#action[disabled]{animation:none;opacity:.95}
#action .prog{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.45)}
#action span{position:relative}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(134,207,69,.6)}70%{box-shadow:0 0 0 14px rgba(134,207,69,0)}100%{box-shadow:0 0 0 0 rgba(134,207,69,0)}}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(79,209,232,.6)}70%{box-shadow:0 0 0 14px rgba(79,209,232,0)}100%{box-shadow:0 0 0 0 rgba(79,209,232,0)}}
@keyframes pulse4{0%{box-shadow:0 0 0 0 rgba(79,182,255,.6)}70%{box-shadow:0 0 0 14px rgba(79,182,255,0)}100%{box-shadow:0 0 0 0 rgba(79,182,255,0)}}
@keyframes pulse3{0%{box-shadow:0 0 0 0 rgba(255,138,61,.6)}70%{box-shadow:0 0 0 14px rgba(255,138,61,0)}100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}}

/* ---- overlay ---- */
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(8,18,28,.45);z-index:10}
.card{width:min(100%,520px);max-height:100%;overflow:auto;padding:20px 22px;border-radius:16px;background:rgba(14,24,33,.95);border:1px solid var(--edge);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.card h1{margin:0;font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--fire)}
.card h2{margin:0;font-size:30px;font-weight:800;text-wrap:balance}
.card h3{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.card .sub{margin:4px 0 14px;color:var(--amber);font-weight:700;letter-spacing:.12em;font-size:13px}
.card p{margin:0 0 12px;line-height:1.4;font-size:16px;color:#d3dfe6;max-width:62ch}
.card ol{margin:0 0 14px;padding-left:20px;line-height:1.4;font-size:15px;color:#d3dfe6;display:grid;gap:4px}
.card ol b{color:var(--ink)}
.board{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0 0 14px;font-size:15px;align-items:center}
.board .chip{justify-self:start}
.board span{color:#d3dfe6;min-width:0}
.board span b{color:var(--ink);font-weight:700}
.card .keys{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:16px}
.card .keys kbd{font:12px var(--font-num);padding:0 5px;border:1px solid var(--edge);border-radius:4px;color:var(--ink)}
.card .btns{display:flex;flex-wrap:wrap;gap:8px}
.cta{padding:12px 22px;border-radius:999px;border:none;background:var(--fire);color:#2a0800;font-weight:800;font-size:17px;letter-spacing:.08em}
.ghost{padding:11px 18px;border-radius:999px;border:1px solid var(--edge);background:transparent;font-weight:700;font-size:15px;letter-spacing:.05em}
.stats{display:flex;gap:18px;margin:0 0 14px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.stats b{display:block;font:20px var(--font-num);color:var(--amber);font-weight:400;letter-spacing:0}

@media (max-width:760px){
  #panel{flex-wrap:wrap;row-gap:8px}
  .center{order:-1;flex:1 1 100%;justify-content:center}
  .gauge{width:68px;height:68px}
  .digi{min-width:104px}.digi b{font-size:15px}
  #mission{flex-basis:auto;flex-grow:1}
  #wallet{display:none}
  #minimap{width:96px;height:96px}
}
@media (max-width:520px){ .att{display:none} .sw{min-width:52px} }
@media (max-height:460px){
  .gauge{width:68px;height:68px}
  .throttle{height:104px}
  #stick{width:110px;height:110px}
  #knob{width:48px;height:48px;margin:-24px 0 0 -24px}
  .start{width:52px;height:52px;font-size:12px}
  .sw{height:34px;min-width:54px;font-size:12px}
  .digi b{font-size:15px}
  .dash{padding:6px}
  #minimap{width:92px;height:92px}
  #mission{font-size:13px;padding:6px 10px}
  #mDesc{font-size:15px}
  #action{padding:9px 16px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){#action,#warn{animation:none}}
@media (max-height:460px){#scoop{top:calc(21% + 34px);font-size:13px;padding:4px 10px 6px}.meter{font-size:11px}}
</style>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="top">
    <button id="menuBtn" class="glass iconbtn" aria-label="Pausar"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
    <div id="mission" class="glass">
      <div class="mrow"><span id="mType" class="chip t-livre">PATRULHA</span><span id="mPay"></span></div>
      <div id="mDesc">—</div>
      <div id="mRoute">—</div>
      <div class="mrow"><svg id="mArrow" viewBox="0 0 24 24"><path d="M12 2l7 18-7-4-7 4z"/></svg><span id="mDist"></span><span id="mStatus"></span></div>
      <div class="meter fire" id="fireRow" hidden><span>FOGO</span><div class="bar"><i id="fireBar"></i></div><span id="fireTxt">100%</span></div>
      <div class="meter water"><span>ÁGUA</span><div class="bar"><i id="tankBar"></i></div><span id="tankTxt">0 L</span></div>
    </div>
    <div class="spacer"></div>
    <div id="wallet" class="glass"><span>R$</span> <b id="money">0</b><small id="deliv">0 focos apagados</small></div>
    <canvas id="minimap" width="124" height="124"></canvas>
  </div>

  <div id="toast"></div>
  <div id="warn" hidden></div>
  <div id="scoop" hidden><span id="scoopTxt"></span><div class="bar"><i id="scoopBar"></i></div></div>

  <div id="panel">
    <div class="dash glass left">
      <div id="throttle" class="throttle" aria-label="Manete de potência">
        <div class="tfill" id="tfill"></div><div class="tslot"></div>
        <span class="tlabel">MANETE</span>
        <div class="thandle" id="thandle">0</div>
      </div>
      <div class="col">
        <button id="startBtn" class="start">START<small>MOTORES</small></button>
        <button id="brakeBtn" class="sw red on"><span>FREIO</span><i class="led"></i></button>
      </div>
    </div>

    <div class="dash glass center">
      <svg class="gauge" id="spd" viewBox="0 0 100 100" aria-label="Velocímetro"></svg>
      <svg class="gauge att" viewBox="-50 -50 100 100" aria-label="Horizonte artificial">
        <defs><clipPath id="attClip"><circle r="45"/></clipPath></defs>
        <circle r="49" fill="#0a1218" stroke="rgba(150,185,205,.35)"/>
        <g clip-path="url(#attClip)">
          <g id="horizon">
            <rect x="-160" y="-160" width="320" height="160" fill="#3f8fd0"/>
            <rect x="-160" y="0" width="320" height="160" fill="#8a5a2e"/>
            <line x1="-160" y1="0" x2="160" y2="0" stroke="#fff" stroke-width="1.2"/>
            <g stroke="#fff" stroke-width=".8">
              <line x1="-10" y1="-16" x2="10" y2="-16"/><line x1="-6" y1="-8" x2="6" y2="-8"/>
              <line x1="-10" y1="16" x2="10" y2="16"/><line x1="-6" y1="8" x2="6" y2="8"/>
              <line x1="-10" y1="-32" x2="10" y2="-32"/><line x1="-10" y1="32" x2="10" y2="32"/>
            </g>
          </g>
        </g>
        <path d="M-26 0h14l4 5 4-5h0M26 0h-14" stroke="#ffb53d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="2" fill="#ffb53d"/>
      </svg>
      <div class="digi">
        <label>ALT</label><b id="dAlt">0 ft</b>
        <label>V/S</label><b id="dVs">0</b>
        <label>RUMO</label><b id="dHdg" class="nav">000°</b>
        <label>PESO</label><b id="dMass">36 t</b>
      </div>
      <div class="switches">
        <button id="gearBtn" class="sw on"><span>TREM</span><i class="led"></i></button>
        <button id="flapBtn" class="sw"><span>FLAPS</span><small id="flapTxt">0</small></button>
        <button id="camBtn" class="sw"><span>CÂMERA</span><small id="camTxt">1</small></button>
        <button id="sndBtn" class="sw on"><span>SOM</span><i class="led"></i></button>
      </div>
    </div>

    <div class="right">
      <button id="action" class="water" hidden><i class="prog" id="actProg"></i><span id="actTxt">SOLTAR ÁGUA</span></button>
      <div id="stick" aria-label="Manche">
        <div id="knob"><svg viewBox="0 0 40 40"><path d="M6 14v8c0 3 2 5 5 5h18c3 0 5-2 5-5v-8M20 27v8"/></svg></div>
        <span class="sticklbl">MANCHE</span>
      </div>
    </div>
  </div>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

const ISLAND={x:13800,z:-2500,r:1800};
const coastX=z=>9000+700*Math.sin(z/2600)+260*Math.sin(z/900+1);
function isWater(x,z){ if(x<coastX(z)) return false; const dx=x-ISLAND.x,dz=z-ISLAND.z; return dx*dx+dz*dz>ISLAND.r*ISLAND.r; }
function local(a,x,z){const rx=x-a.x,rz=z-a.z;return {along:rx*a.dx+rz*a.dz,across:rx*a.rx+rz*a.rz};}
function wpt(a,along,across){return [a.x+a.dx*along+a.rx*across, a.z+a.dz*along+a.rz*across];}
function onRunway(a,x,z){const l=local(a,x,z);return Math.abs(l.along)<a.len/2+20&&Math.abs(l.across)<a.w/2+3;}
function inAirport(a,x,z){const l=local(a,x,z);return Math.abs(l.along)<a.len/2+160&&l.across>-90&&l.across<270;}
function airportAt(x,z){for(let i=0;i<AIRPORTS.length;i++) if(inAirport(AIRPORTS[i],x,z)) return i; return -1;}
function nearAirport(x,z,pad){for(const a of AIRPORTS){const l=local(a,x,z); if(Math.abs(l.along)<a.len/2+pad&&Math.abs(l.across)<pad+260) return true;} return false;}

/* rivers and the lagoon: where the Hercules scoops water */
function polyX(f,x0,x1,step){const p=[];for(let x=x0;x<x1;x+=step) p.push([x,f(x)]);p.push([x1,f(x1)]);return p;}
function polyZ(f,z0,z1,step){const p=[];for(let z=z0;z<z1;z+=step) p.push([f(z),z]);p.push([f(z1),z1]);return p;}

const rx2=z=>-6800+600*Math.sin(z/2000)+180*Math.sin(z/650);
const rz3=x=>-9800+500*Math.sin(x/1900);
const RIVERS=[
  {name:'Rio Curimataú',hw:80,pts:polyX(rz1,-20500,10800,90)},
  {name:'Rio Catu',hw:62,pts:polyZ(rx2,-17800,rz1(rx2(4300))+30,90)},
  {name:'Rio Guaju',hw:62,pts:polyX(rz3,rx2(-9800)-30,10800,90)},
];
const LAKE={name:'Lagoa Guaraíras',x:-14500,z:-1500,r:1050};
const CELL=1000,RGRID=new Map();
RIVERS.forEach((r,ri)=>{for(let i=0;i<r.pts.length-1;i++){const a=r.pts[i],b=r.pts[i+1],pad=r.hw+420;
  const cx0=Math.floor((Math.min(a[0],b[0])-pad)/CELL),cx1=Math.floor((Math.max(a[0],b[0])+pad)/CELL);
  const cz0=Math.floor((Math.min(a[1],b[1])-pad)/CELL),cz1=Math.floor((Math.max(a[1],b[1])+pad)/CELL);
  for(let cx=cx0;cx<=cx1;cx++) for(let cz=cz0;cz<=cz1;cz++){const k=cx+','+cz;let l=RGRID.get(k);if(!l) RGRID.set(k,l=[]);l.push(ri,i);}}});
function segDist(r,i,x,z){const a=r.pts[i],b=r.pts[i+1],ex=b[0]-a[0],ez=b[1]-a[1];
  const t=clamp(((x-a[0])*ex+(z-a[1])*ez)/(ex*ex+ez*ez),0,1),px=a[0]+ex*t,pz=a[1]+ez*t;return [Math.hypot(x-px,z-pz)-r.hw,px,pz];}
/* distance from the nearest bank (negative = over the water); only exact within ~400 m */
function riverNear(x,z){
  let best={d:1e9,ri:-2,px:0,pz:0};
  const l=RGRID.get(Math.floor(x/CELL)+','+Math.floor(z/CELL));
  if(l) for(let k=0;k<l.length;k+=2){const ri=l[k],s=segDist(RIVERS[ri],l[k+1],x,z);if(s[0]<best.d) best={d:s[0],ri,px:s[1],pz:s[2]};}
  const dl=Math.hypot(x-LAKE.x,z-LAKE.z)-LAKE.r;
  if(dl<best.d) best={d:dl,ri:-1,px:LAKE.x,pz:LAKE.z};
  return best;
}
function riverDistFull(x,z){let d=Math.hypot(x-LAKE.x,z-LAKE.z)-LAKE.r;for(const r of RIVERS) for(let i=0;i<r.pts.length-1;i+=2) d=Math.min(d,segDist(r,i,x,z)[0]);return d;}
const nearFresh=(x,z,pad)=>riverNear(x,z).d<pad;
const waterName=ri=>ri>=0?RIVERS[ri].name:LAKE.name;
const anyWater=(x,z)=>isWater(x,z)||riverNear(x,z).d<0;

function lam(color,extra){return new THREE.MeshLambertMaterial(Object.assign({color},extra||{}));}
function layerMat(color,off,extra){return lam(color,Object.assign({polygonOffset:true,polygonOffsetFactor:-off,polygonOffsetUnits:-off*2},extra||{}));}

/* merge simple parts into one vertex-colored geometry: [geo, color, x,y,z, rotY] */
function mergeParts(parts){
  const pos=[],nor=[],col=[],c=new THREE.Color(),m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),one=new THREE.Vector3(1,1,1),v=new THREE.Vector3();
  for(const p of parts){
    const g=(p[0].index?p[0].toNonIndexed():p[0].clone());
    e.set(0,p[5]||0,0);q.setFromEuler(e);v.set(p[2]||0,p[3]||0,p[4]||0);m.compose(v,q,one);g.applyMatrix4(m);
    const pa=g.attributes.position.array,na=g.attributes.normal.array;
    for(let i=0;i<pa.length;i++){pos.push(pa[i]);nor.push(na[i]);}
    c.setHex(p[1]);for(let i=0;i<pa.length/3;i++) col.push(c.r,c.g,c.b);
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return out;
}

function strip(f1,f2,z0,z1,N,y,mat){
  const pos=[],idx=[];
  for(let i=0;i<=N;i++){const z=z0+(z1-z0)*i/N;pos.push(f1(z),y,z,f2(z),y,z);}
  for(let i=0;i<N;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);scene.add(m);return m;
}

/* rivers + lagoon */
function ribbon(pts,hw,y,mat){
  const pos=[],idx=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
    let tx=b[0]-a[0],tz=b[1]-a[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    pos.push(pts[i][0]-tz*hw,y,pts[i][1]+tx*hw, pts[i][0]+tz*hw,y,pts[i][1]-tx*hw);
  }
  for(let i=0;i<pts.length-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);scene.add(m);return m;
}

/* hills (collision) */
const HILLS=[];
(function(){
  const mat=lam(0x6d8a4c,{flatShading:true}), mat2=lam(0x8a8160,{flatShading:true});
  let tries=0;
  while(HILLS.length<30&&tries<3000){tries++;
    const r=600+rnd()*1200,h=260+rnd()*560,x=-21000+rnd()*14500,z=-16000+rnd()*32000;
    let bad=false;
    for(const a of AIRPORTS){const l=local(a,x,z);if(Math.hypot(x-a.x,z-a.z)<2800+r||(Math.abs(l.across)<1400+r&&Math.abs(l.along)<7500)) bad=true;}
    if(riverDistFull(x,z)<r+350||nearForest(x,z,r+300)) bad=true;
    for(const hh of HILLS) if(Math.hypot(x-hh.x,z-hh.z)<(r+hh.r)*0.6) bad=true;
    if(bad) continue;
    const mesh=new THREE.Mesh(new THREE.ConeGeometry(r,h,7,2),rnd()<.65?mat:mat2);mesh.position.set(x,h/2,z);mesh.rotation.y=rnd()*6;scene.add(mesh);
    HILLS.push({x,z,r,h});}
  for(let i=0;i<26;i++){const ang=(i/26)*Math.PI*2, R=26000+rnd()*3000;const x=Math.cos(ang)*R, z=Math.sin(ang)*R; if(isWater(x,z)) continue;
    const r=2500+rnd()*2500,h=1200+rnd()*1500;const mesh=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),mat2);mesh.position.set(x,h/2,z);scene.add(mesh);}
})();

/* trees: scattered groves plus dense forests that can burn */
const TREE_REC=FORESTS.map(()=>[]); let treeMeshes;
(function(){
  const cone=new THREE.ConeGeometry(5,16,6); cone.translate(0,8,0);
  const ball=new THREE.IcosahedronGeometry(6,0); ball.translate(0,7,0);
  const palm=new THREE.ConeGeometry(4.5,3,6); palm.translate(0,12,0);
  const N=5200;
  const mA=new THREE.InstancedMesh(cone,lam(0xffffff,{flatShading:true}),N); mA.frustumCulled=false;
  const mB=new THREE.InstancedMesh(ball,lam(0xffffff,{flatShading:true}),N); mB.frustumCulled=false;
  treeMeshes=[mA,mB];
  const o=new THREE.Object3D(); let na=0,nb=0,tries=0;
  const g1=[0x2f5a2a,0x3b6b2f,0x2a4d26].map(c=>new THREE.Color(c)), g2=[0x4c7d35,0x5d8f3b,0x3f6d2e,0x6e9a40].map(c=>new THREE.Color(c));
  function tree(x,z,fi){
    if(isWater(x,z)||nearAirport(x,z,120)||nearFresh(x,z,45)) return;
    for(const b of BUILDINGS) if(Math.abs(x-b.x)<b.hw+6&&Math.abs(z-b.z)<b.hd+6) return;
    const s=(fi>=0?1.0:0.7)+rnd()*0.9;o.position.set(x,0,z);o.rotation.set(0,rnd()*6,0);o.scale.set(s,s*(0.8+rnd()*.5),s);o.updateMatrix();
    if(rnd()<(fi>=0?.55:.45)&&x<coastX(z)-1200){ if(na<N){mA.setMatrixAt(na,o.matrix);mA.setColorAt(na,g1[Math.floor(rnd()*3)]);if(fi>=0) TREE_REC[fi].push([0,na,x,z]);na++;} }
    else if(nb<N){mB.setMatrixAt(nb,o.matrix);mB.setColorAt(nb,g2[Math.floor(rnd()*4)]);if(fi>=0) TREE_REC[fi].push([1,nb,x,z]);nb++;}
  }
  FORESTS.forEach((f,fi)=>{for(let i=0;i<520;i++){const a=rnd()*6.28,R=Math.sqrt(rnd())*f.r;tree(f.x+Math.cos(a)*R,f.z+Math.sin(a)*R,fi);}});
  while((na+nb)<7400&&tries<30000){tries++;
    let x,z;
    if(rnd()<.55){const a=AIRPORTS[Math.floor(rnd()*AIRPORTS.length)];const ang=rnd()*6.28,R=300+rnd()*3500;x=a.x+Math.cos(ang)*R;z=a.z+Math.sin(ang)*R;}
    else{x=-19000+rnd()*35000;z=-16000+rnd()*32000;}

function puffStep(f,p,dt,frac,act){

    const nVis=Math.ceil(f.flames.length*act);

      fl.m.scale.set(w,h,w);fl.m.position.set(fl.ox,fl.oy,fl.oz);fl.m.rotation.y=time*0.6+fl.ph;});

}

  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const n=AC.createBufferSource();n.buffer=buf;n.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=.5;const ng=AC.createGain();ng.gain.value=0;n.connect(bp);bp.connect(ng);ng.connect(master);n.start();

function step(dt){
  if(st.engine==='starting'){st.engineT+=dt;for(let i=0;i<4;i++) if(st.engineT>i*0.9) st.rpm[i]=Math.min(1,st.rpm[i]+dt*0.75);
    if(st.rpm.every(r=>r>=1)){st.engine='on';toast(st.brake?'Motores ligados. Solte o FREIO e empurre a manete.':'Motores ligados!','good');}}
  else if(st.engine==='off'){for(let i=0;i<4;i++) st.rpm[i]=Math.max(0,st.rpm[i]-dt*0.3);}
  const rpm=st.engine==='on'?1:(st.engine==='starting'?avgRpm()*0.3:0);

  let inP=joy.y,inR=joy.x,inY=0;
  if(keys.ArrowDown) inP+=1; if(keys.ArrowUp) inP-=1;
  if(keys.ArrowRight) inR+=1; if(keys.ArrowLeft) inR-=1;
  if(keys.KeyD) inY+=1; if(keys.KeyA) inY-=1;
  if(keys.KeyW||keys.ShiftLeft) st.throttle=Math.min(1,st.throttle+dt*0.5);
  if(keys.KeyS||keys.ControlLeft) st.throttle=Math.max(0,st.throttle-dt*0.5);
  inP=clamp(inP,-1,1);inR=clamp(inR,-1,1);
  inP=Math.sign(inP)*Math.pow(Math.abs(inP),1.4);inR=Math.sign(inR)*Math.pow(Math.abs(inR),1.3);

  const mass=massNow(),vs=vStall();
  const thrust=rpm*st.throttle*4.3*(36/mass)*Math.max(0,1-st.speed/235);
  const k=1.2e-4+(st.gear?0.3e-4:0)+[0,0.25e-4,0.6e-4][st.flaps];
  let acc=thrust-k*st.speed*st.speed-G*Math.sin(st.pitch)*0.85;
  if(st.scooping) acc-=1.3;
  let rwy=false;
  if(st.onGround){
    for(const a of AIRPORTS) if(onRunway(a,st.pos.x,st.pos.z)||inAirport(a,st.pos.x,st.pos.z)) rwy=true;
    acc-=0.12;if(st.brake) acc-=3.6;if(!rwy) acc-=0.9;
  }
  st.speed=Math.max(0,st.speed+acc*dt);

  const eff=clamp(st.speed/55,0.15,1);
  if(st.onGround){
    st.roll+=(0-st.roll)*Math.min(1,dt*6);
    if(st.speed>vs*0.95&&inP>0.05) st.pitch+=inP*0.24*dt; else st.pitch+=(0-st.pitch)*Math.min(1,dt*1.2);
    st.pitch=clamp(st.pitch,0,14*DEG);
    const steerIn=clamp(inY+joy.x+(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),-1,1);
    const steer=steerIn*0.45*clamp(st.speed/6,0,1)*(st.speed<30?1:30/st.speed);
    st.yaw-=steer*dt;
    const climb=Math.sin(st.pitch)*st.speed;
    if(st.speed>=vs&&climb>0.6){st.onGround=false;st.vy=0;}
    else st.pos.y=GEAR_H;
  }else{
    st.pitch+=inP*0.45*eff*dt;
    st.roll+=inR*1.05*eff*dt;
    if(Math.abs(inR)<0.05) st.roll-=st.roll*Math.min(1,dt*0.45);
    st.pitch=clamp(st.pitch,-30*DEG,25*DEG);st.roll=clamp(st.roll,-65*DEG,65*DEG);
    st.yaw-=(G*Math.tan(st.roll)/Math.max(st.speed,35))*dt;
    st.yaw-=inY*0.12*dt;
    if(st.speed<vs){const f=1-Math.pow(st.speed/vs,2);st.vy-=G*f*dt*1.2;st.pitch-=0.35*f*dt;}
    else st.vy+=(0-st.vy)*Math.min(1,dt*1.3);
    // hot air over the flames shakes the plane
    for(const f of FIRES){ if(f.out) continue;
      const d=Math.hypot(st.pos.x-f.x,st.pos.z-f.z);
      if(d<f.r+90&&st.pos.y<f.y+160){const q=clamp(f.hp/f.cap,.25,1);
        st.roll+=(Math.random()-.5)*3.2*q*dt;st.pitch+=(Math.random()-.5)*1.4*q*dt;st.vy+=(Math.random()-.25)*9*q*dt;}
    }
    st.vy=Math.max(st.vy,-45);
  }

  const cp=Math.cos(st.pitch);
  const fx=-Math.sin(st.yaw)*cp,fy=Math.sin(st.pitch),fz=-Math.cos(st.yaw)*cp;
  st.pos.x+=fx*st.speed*dt;st.pos.z+=fz*st.speed*dt;
  const vY=st.onGround?0:fy*st.speed+st.vy;
  if(!st.onGround) st.pos.y+=vY*dt;
  if(st.pos.y>7000) st.pos.y=7000;
  st.vel.set(fx*st.speed,vY,fz*st.speed);

  const wn=riverNear(st.pos.x,st.pos.z),overFresh=wn.d<0;
  if(!st.onGround){
    const contact=st.gear?GEAR_H:BELLY_H;
    if(st.pos.y<=contact){
      const sink=-vY;
      if(overFresh) return crash(`O Hércules encostou na água do ${waterName(wn.ri)}. Para encher, voe baixo sem tocar no rio: entre 10 e 100 pés.`);
      if(isWater(st.pos.x,st.pos.z)) return crash('Pouso no mar! O Hércules não é hidroavião.');
      if(!st.gear) return crash('Pouso de barriga: o trem de pouso estava recolhido. Toque em TREM antes de pousar.');
      if(Math.abs(st.roll)>18*DEG) return crash('A asa raspou no chão. Nivele as asas antes de tocar a pista.');
      if(st.pitch<-6*DEG) return crash('O avião tocou de bico. Levante um pouco o nariz antes de pousar.');
      if(sink>7) return crash(`Pouso duro demais (${fmt(sink*196.85)} pés/min). Reduza a descida perto do chão.`);
      st.onGround=true;st.pos.y=GEAR_H;st.vy=0;st.roll=0;
      let onRw=false;for(const a of AIRPORTS) if(onRunway(a,st.pos.x,st.pos.z)) onRw=true;
      if(sink>4){toast('Pouso duro!','warn');beep(200,.2,'sawtooth');}
      else if(sink<1.8&&onRw&&performance.now()-st.softT>25000){st.softT=performance.now();save.money+=300;persist();toast('Pouso suave! +R$ 300','good');coin();}
      else toast(onRw?'Pouso bom!':'Pousou fora da pista','warn');
      if(onRw) beep(160,.25,'triangle',.1);
    }
  }else if(isWater(st.pos.x,st.pos.z)||overFresh) return crash('O avião saiu da área de terra e caiu na água.');

  if(st.pos.y<1000){
    for(const h of HILLS){const d=Math.hypot(st.pos.x-h.x,st.pos.z-h.z);if(d<h.r&&st.pos.y-2<h.h*(1-d/h.r)) return crash('Batemos no morro! Ganhe altitude antes de cruzar a serra.');}
    if(st.pos.y<110) for(const b of BUILDINGS){if(Math.abs(st.pos.x-b.x)<b.hw+14&&Math.abs(st.pos.z-b.z)<b.hd+14&&st.pos.y-3<b.h) return crash('Colisão com um prédio. Passe por cima dos prédios, não entre eles.');}
  }

  // scoop water from rivers and the lagoon
  const agl=st.pos.y-GEAR_H;
  st.overWater=overFresh?waterName(wn.ri):null;
  st.scooping=!st.onGround&&overFresh&&agl<SCOOP_AGL&&st.speed>vs*0.97&&st.water<TANK;
  if(st.scooping){
    st.water=Math.min(TANK,st.water+SCOOP_RATE*dt);
    st.sprayAcc+=dt*45;const n=Math.floor(st.sprayAcc);st.sprayAcc-=n;emitSpray(n);
    if(st.water>=TANK){toast('Tanque cheio! Suba e voe até o fogo.','good');beep(660,.15);beep(990,.2);}
  }

  // pour water while the button is held
  st.pourMin=Math.max(0,st.pourMin-dt);
  const want=(st.dropHeld||keys.Space||st.pourMin>0)&&!st.onGround&&st.water>0;
  if(want){
    if(!st.pouring){st.pouring=true;st.drop={hit:0,fire:null,agl,killed:false};beep(180,.3,'triangle',.08);}
    const L=Math.min(st.water,POUR_RATE*dt);st.water-=L;save.liters+=L;
    st.emitAcc+=L/40;const n=Math.floor(st.emitAcc);st.emitAcc-=n;if(n) emitPour(n,40,agl);
    if(st.water<=0){st.water=0;toast('Tanque vazio! Procure um rio para encher.','warn');}
  }else if(st.pouring){st.pouring=false;endDrop();persist();}

  st.vsNow=vY;st.vsStall=vs;st.agl=agl;
}

const _d=new THREE.Vector3();

function updCamera(dt){
  cam.idle+=dt;
  const dragging=cam.ptr.size>0;
  if(st.cam===1&&!st.crashed){
    if(!dragging&&cam.idle>2){cam.lookYaw*=Math.exp(-dt*2);cam.lookPitch*=Math.exp(-dt*2);}
    const p=plane.localToWorld(_a.set(0,1.75,-13.3));camera.position.copy(p);camera.quaternion.copy(plane.quaternion);
    camera.rotateY(-cam.lookYaw);camera.rotateX(-0.12-cam.lookPitch);cam.init=true;return;
  }
  if(st.cam===0&&!dragging&&cam.idle>2.5){cam.yaw=wrapA(cam.yaw);cam.yaw*=Math.exp(-dt*1.5);cam.pitch*=Math.exp(-dt*1.5);}

  const ang=st.yaw+cam.yaw,el=clamp(0.26+cam.pitch,-0.08,1.4);

  camera.up.set(0,1,0);
  const ahead=st.crashed?0:20*Math.max(0,Math.cos(cam.yaw))*(st.cam===0?1:0);
  _b.set(-Math.sin(st.yaw),0,-Math.cos(st.yaw));

  el.horizon.setAttribute('transform',`rotate(${(-st.roll/DEG).toFixed(1)}) translate(0 ${(st.pitch/DEG*1.6).toFixed(1)})`);
  el.thandle.textContent=Math.round(st.throttle*100);
  const H=el.throttle.clientHeight;el.thandle.style.transform=`translateY(${-st.throttle*(H-28)}px)`;el.tfill.style.height=(st.throttle*100)+'%';
  const wf=st.water/TANK;
  el.tankBar.style.width=(wf*100)+'%';el.tankTxt.textContent=fmt(st.water)+' L';
  if(st.scooping){el.scoop.hidden=false;el.scoop.className='';el.scoopTxt.textContent=`ENCHENDO · ${st.overWater} · ${Math.round(wf*100)}%`;el.scoopBar.style.width=(wf*100)+'%';}
  else if(st.overWater&&!st.onGround&&!st.crashed&&st.water<TANK){el.scoop.hidden=false;el.scoop.className='idle';el.scoopTxt.textContent=`${st.overWater} · desça abaixo de 100 ft para encher`;}
  else el.scoop.hidden=true;
  hudTick+=dt;if(hudTick<0.1) return;hudTick=0;

  if(!st.onGround&&st.water>0){const p=predictImpact();predTarget.set(p.x,Math.max(1,p.y)+0.6,p.z);predOn=!!fireAt(p.x,p.z);if(!predict.visible) predict.position.copy(predTarget);}

  const vs0=(52-9+(massNow()-36)*0.45)*1.944;
  el.flapArc.setAttribute('d',arcPath(vs0,175,45.5));el.greenArc.setAttribute('d',arcPath(Math.max(sk,(52+(massNow()-36)*.45)*1.944),280,45.5));
  const agl=Math.max(0,st.pos.y-GEAR_H);
  el.alt.textContent=fmt(agl*3.281)+' ft';
  const fpm=(st.vsNow||0)*196.85;el.vs.textContent=(fpm>=0?'+':'−')+fmt(Math.abs(Math.round(fpm/10)*10));
  el.hdg.textContent=String(Math.round(((-st.yaw/DEG)%360+360)%360)%360).padStart(3,'0')+'°';
  el.mass.textContent=dec1(massNow())+' t';
  el.start.classList.toggle('on',st.engine==='on');el.start.classList.toggle('busy',st.engine==='starting');
  el.start.firstChild.textContent=st.engine==='off'?'START':'STOP';
  el.brake.classList.toggle('on',st.brake);el.gear.classList.toggle('on',st.gear);
  el.flapTxt.textContent=['0','15°','30°'][st.flaps];el.camTxt.textContent=st.cam+1;
  el.money.textContent=fmt(save.money);el.deliv.textContent=save.fires+(save.fires===1?' foco apagado':' focos apagados');

  let w='';
  if(!st.crashed&&!st.onGround){
    if(st.speed<(st.vsStall||52)+4) w='ESTOL — BAIXE O NARIZ';
    else if(!st.gear&&agl<180&&(st.vsNow||0)<-1&&nearAirport(st.pos.x,st.pos.z,2500)) w='BAIXE O TREM';
    else if(agl<70&&(st.vsNow||0)<-9) w='SUBA! DESCIDA RÁPIDA';
  }
  if(w){el.warn.textContent=w;el.warn.hidden=false;if(time-lastWarnBeep>0.8){beep(880,.12,'square',.05);lastWarnBeep=time;}} else el.warn.hidden=true;

  // mission card
  const nt=navTarget();navCache=nt;const t=nt.kind;
  if(t!==lastType){el.mType.className='chip t-'+t;el.mType.innerHTML=ICON[t]+TYPES[t].label;lastType=t;}
  el.mArrow.querySelector('path').style.fill=TCOLOR[t];
  const dx=nt.x-st.pos.x,dz=nt.z-st.pos.z,dist=Math.hypot(dx,dz);
  el.mArrow.style.transform=`rotate(${((Math.atan2(dx,-dz)+st.yaw)/DEG).toFixed(0)}deg)`;
  el.mDist.textContent=dec1(dist/1000)+' km';
  const active=FIRES.filter(f=>!f.out).length;
  let s='',pay='';
  if(t==='agua'){
    el.mDesc.textContent=st.water<=0?'Tanque vazio':(active?'Tanque quase vazio':'Encha o tanque');
    el.mRoute.innerHTML=`Encha no <b>${nt.name}</b>`;
    s=st.scooping?'Enchendo!':st.overWater?'Desça abaixo de 100 ft, sem tocar na água':st.onGround?'Decole e siga a seta azul':'Siga a seta azul até a água';
  }else if(nt.fire){
    const f=nt.fire;
    el.mDesc.textContent=f.name;
    el.mRoute.textContent=(f.kind==='predio'?'Incêndio em prédio':`Mata em chamas · ${fmt(f.r*2)} m`)+' · há '+mmss(f.t);
    pay='R$ '+fmt(firePay(f));
    if(st.onGround) s=st.water>0?'Decole e siga a fumaça':'Encha o tanque num rio';
    else if(dist<1800) s=predOn?'No alvo! Segure SOLTAR ÁGUA':'Desça e ponha o X no fogo';
    else s=`Siga a fumaça · ${active} ${active===1?'foco':'focos'}`;
  }else{
    el.mDesc.textContent='Nenhum incêndio agora';el.mRoute.textContent='O rádio avisa quando surgir um novo foco';
    s=st.water<TANK?'Aproveite para encher o tanque':'Tanque cheio, fique de prontidão';
  }
  const tf=nt.fire;el.fireRow.hidden=!tf;
  if(tf){const fr=clamp(tf.hp/tf.cap,0,1);el.fireBar.style.width=(fr*100)+'%';el.fireTxt.textContent=Math.max(1,Math.round(fr*100))+'%';}
  el.mPay.textContent=pay;
  el.mStatus.innerHTML='· '+s;

  const show=!st.onGround&&st.water>0&&!st.crashed;
  el.action.hidden=!show;
  if(show){el.action.classList.toggle('pour',st.pouring);el.actTxt.textContent=st.pouring?`SOLTANDO… ${fmt(st.water)} L`:'SOLTAR ÁGUA';el.actProg.style.width=(wf*100)+'%';}
}

/* minimap */
const MM={X0:-19000,Z0:-15000,SPAN:36000};
const mmCanvas=$('#minimap');const mmBg=document.createElement('canvas');
function mmSetup(){
  const dpr=Math.min(2,window.devicePixelRatio||1);const S=Math.round(mmCanvas.clientWidth*dpr)||124;
  mmCanvas.width=mmCanvas.height=S;mmBg.width=mmBg.height=S;const g=mmBg.getContext('2d');
  const tx=x=>(x-MM.X0)/MM.SPAN*S,tz=z=>(z-MM.Z0)/MM.SPAN*S;
  g.fillStyle='#2d4a2a';g.fillRect(0,0,S,S);
  g.fillStyle='#1d5a82';g.beginPath();g.moveTo(S,0);for(let i=0;i<=60;i++){const z=MM.Z0+MM.SPAN*i/60;g.lineTo(tx(coastX(z)),tz(z));}g.lineTo(S,S);g.closePath();g.fill();
  g.fillStyle='#2d4a2a';g.beginPath();g.arc(tx(ISLAND.x),tz(ISLAND.z),ISLAND.r/MM.SPAN*S,0,7);g.fill();
  g.fillStyle='#55603f';for(const h of HILLS){g.beginPath();g.arc(tx(h.x),tz(h.z),Math.max(1.5,h.r/MM.SPAN*S),0,7);g.fill();}
  g.fillStyle='#1f3a1c';for(const f of FORESTS){g.beginPath();g.arc(tx(f.x),tz(f.z),f.r/MM.SPAN*S,0,7);g.fill();}
  g.fillStyle='#9aa4a8';for(const b of BUILDINGS) g.fillRect(tx(b.x)-dpr*.6,tz(b.z)-dpr*.6,dpr*1.2,dpr*1.2);
  g.strokeStyle='#4fb6ff';g.lineCap='round';g.lineJoin='round';
  for(const r of RIVERS){g.lineWidth=Math.max(1.6*dpr,r.hw*2/MM.SPAN*S);g.beginPath();r.pts.forEach((p,i)=>{i?g.lineTo(tx(p[0]),tz(p[1])):g.moveTo(tx(p[0]),tz(p[1]));});g.stroke();}
  g.fillStyle='#4fb6ff';g.beginPath();g.arc(tx(LAKE.x),tz(LAKE.z),Math.max(2*dpr,LAKE.r/MM.SPAN*S),0,7);g.fill();
  g.lineWidth=Math.max(2,2*dpr);
  g.font=`700 ${9*dpr}px Saira Condensed,sans-serif`;g.textAlign='center';
  for(const a of AIRPORTS){const [x1,z1]=wpt(a,-a.len/2,0),[x2,z2]=wpt(a,a.len/2,0);g.strokeStyle='#d8e2e8';g.beginPath();g.moveTo(tx(x1),tz(z1));g.lineTo(tx(x2),tz(z2));g.stroke();
    g.fillStyle=a.base?'#ff6a4d':'#d8e2e8';g.fillText(a.id,tx(a.x),tz(a.z)+11*dpr);}
  MM.S=S;MM.dpr=dpr;
}
function mmDraw(){
  const g=mmCanvas.getContext('2d'),S=MM.S,dpr=MM.dpr;g.clearRect(0,0,S,S);g.drawImage(mmBg,0,0);
  const tx=x=>(x-MM.X0)/MM.SPAN*S,tz=z=>(z-MM.Z0)/MM.SPAN*S;
  for(const f of FIRES){ if(f.out) continue;
    const r=(2.5+Math.min(3,f.r/80))*dpr*(1+0.25*Math.sin(time*6));
    g.fillStyle='#ff5a2a';g.beginPath();g.arc(tx(f.x),tz(f.z),r,0,7);g.fill();
    g.fillStyle='#ffd23a';g.beginPath();g.arc(tx(f.x),tz(f.z),r*.45,0,7);g.fill();}
  const nt=navCache;
  if(nt&&nt.kind!=='livre'){g.strokeStyle=nt.kind==='agua'?'#7fd0ff':'#ffffff';g.lineWidth=1.6*dpr;g.beginPath();g.arc(tx(nt.x),tz(nt.z),(8+2*Math.sin(time*4))*dpr,0,7);g.stroke();}
  g.save();g.translate(clamp(tx(st.pos.x),4,S-4),clamp(tz(st.pos.z),4,S-4));g.rotate(-st.yaw);
  g.fillStyle='#ffb53d';g.strokeStyle='#0a1218';g.lineWidth=1.2*dpr;g.beginPath();g.moveTo(0,-7*dpr);g.lineTo(5*dpr,6*dpr);g.lineTo(0,3.5*dpr);g.lineTo(-5*dpr,6*dpr);g.closePath();g.fill();g.stroke();g.restore();
}

let toastT=null;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>{t.className='';},3600);}

/* ================== OVERLAYS ================== */
function showCard(html){$('#card').innerHTML=html;$('#overlay').hidden=false;}
function hideCard(){$('#overlay').hidden=true;}
function resume(){hideCard();st.paused=false;initAudio();}
const HOWTO=`<ol>
  <li><b>START</b> liga os quatro motores. Solte o <b>FREIO</b>, empurre a <b>MANETE</b> até o fim e, passando da marca vermelha do velocímetro, puxe o <b>MANCHE</b> para baixo para subir.</li>
  <li>Siga a seta e a coluna de fumaça até o incêndio. Desça e coloque o <b>X amarelo</b> do chão em cima do fogo; ele fica <b>verde</b> quando está no alvo.</li>
  <li>Segure <b>SOLTAR ÁGUA</b> para lançar. Quanto mais baixo, melhor: acima de 650 ft a água se espalha no ar e quase não ajuda.</li>
  <li><b>Tanque vazio?</b> Voe até um rio ou a lagoa, em azul no mapa, e passe abaixo de 100 ft sem encostar na água. O tanque enche sozinho.</li>
  <li>O fogo da mata cresce com o tempo. O ar quente balança o avião em cima das chamas, e os prédios da cidade são altos: cuidado.</li>
  <li>Pouse com <b>TREM</b> baixado, <b>FLAPS</b> 30° e descida lenta. Arraste a tela para girar a câmera; dois dedos ou a roda do mouse mudam o zoom.</li>
</ol>
<div class="keys">Teclado: <kbd>W</kbd>/<kbd>S</kbd> manete · <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> manche · <kbd>A</kbd>/<kbd>D</kbd> leme · <kbd>E</kbd> motores · <kbd>B</kbd> freio · <kbd>G</kbd> trem · <kbd>F</kbd> flaps · <kbd>C</kbd> câmera · <kbd>Q</kbd>/<kbd>R</kbd> girar câmera · <kbd>Espaço</kbd> (segurar) soltar água · <kbd>P</kbd> pausa</div>`;
function showIntro(){
  st.paused=true;
  showCard(`<h1>Hércules <em>Bombeiro</em></h1><p class="sub">PILOTO DE COMBATE A INCÊNDIOS</p>
    <p>A cidade e as matas estão pegando fogo. Encha o tanque voando baixo sobre os rios e solte a água em cima das chamas.</p>
    ${save.fires?`<div class="stats"><span>CAIXA<b>R$ ${fmt(save.money)}</b></span><span>FOCOS<b>${save.fires}</b></span><span>ÁGUA<b>${fmt(save.liters/1000)} mil L</b></span></div>`:''}
    ${HOWTO}
    <div class="btns"><button class="cta" id="go">Decolar</button></div>
    <p style="margin:12px 0 0;font-size:13px;color:var(--muted)">No celular, jogue com a tela deitada.</p>`);
  $('#go').onclick=()=>{initAudio();resume();toast('Tanque cheio e dois incêndios no rádio. Toque em START.');};
}
function showPause(){
  st.paused=true;
  const f=nearestFire();
  showCard(`<h2>Pausa</h2><p class="sub">${f?('FOGO: '+f.name).toUpperCase():'NENHUM INCÊNDIO AGORA'}</p>
    <div class="btns" style="margin-bottom:14px">
      <button class="cta" id="cont">Continuar</button>
      <button class="ghost" id="reset">Voltar à cabeceira</button>
      <button class="ghost" id="snd">${muted?'Ligar som':'Desligar som'}</button>
    </div>${HOWTO}`);
  $('#cont').onclick=resume;
  $('#reset').onclick=()=>{const eng=st.engine;placeAt(st.lastAirport);st.engine=eng==='off'?'off':'on';if(st.engine==='on') st.rpm=[1,1,1,1];shadow.visible=true;resume();};
  $('#snd').onclick=()=>{initAudio();setMute(!muted);showPause();};
}

/* ================== LOOP ================== */
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?72:60;camera.updateProjectionMatrix();mmSetup();}
window.addEventListener('resize',resize);

placeAt(0);
spawnFire('predio','Centro');spawnFire('floresta');
resize();showIntro();
let last=performance.now(),mmT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!st.paused&&!st.crashed) step(dt);
  if(!st.paused) updWater(dt);
  updFires(dt,st.paused);
  updFX(dt);updVisuals(dt);updCamera(dt);updHUD(dt);updAudio();
  mmT+=dt;if(mmT>0.08){mmT=0;mmDraw();}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!st.paused&&!st.crashed) showPause();});
})();
</script>
