<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota das Iguanas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-bleed 3D world; avionics dashboard docked at the bottom; mission card + map at the top */
:root{
  --panel: rgba(16,26,36,.80);
  --panel-deep:#0a1218;
  --edge: rgba(150,185,205,.24);
  --ink:#e9f1f5;
  --muted:#93a8b5;
  --amber:#ffb53d;
  --nav:#4fd1e8;
  --iguana:#86cf45;
  --car:#9db4ff;
  --fruit:#ff8a3d;
  --urgent:#ff6b81;
  --danger:#ff5a4e;
  --font-ui:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --font-num:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#8fc3e6;color:var(--ink);font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none}
#hud button,.throttle,#stick{pointer-events:auto}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--nav);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--edge);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(0,12,24,.28)}

/* ---- top ---- */
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px;fill:var(--ink)}
#mission{min-width:0;flex:0 1 350px;padding:8px 12px 9px;font-size:14px;line-height:1.25;display:flex;flex-direction:column;gap:3px}
.mrow{display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.1em;white-space:nowrap}
.chip svg{width:16px;height:16px;fill:currentColor}
.t-carga{background:rgba(255,181,61,.18);color:var(--amber)}
.t-carros{background:rgba(157,180,255,.2);color:var(--car)}
.t-iguanas{background:rgba(134,207,69,.2);color:var(--iguana)}
.t-frutas{background:rgba(255,138,61,.2);color:var(--fruit)}
.t-urgente{background:rgba(255,107,129,.2);color:var(--urgent)}
.t-livre{background:rgba(255,255,255,.1);color:var(--muted)}
#mPay{margin-left:auto;font-family:var(--font-num);color:var(--ink);font-size:15px;white-space:nowrap}
#mDesc{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mRoute{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mRoute b{color:var(--ink);font-weight:600}
#mArrow{width:22px;height:22px;flex:none;transition:transform .15s linear}
#mArrow path{fill:var(--nav)}
#mDist{font-family:var(--font-num);color:var(--nav);white-space:nowrap}
#mStatus{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#mStatus .late{color:var(--danger)}
#mStatus .ok{color:var(--urgent)}
#welfare{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--iguana)}
#welfare .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#welfare .bar i{display:block;height:100%;width:100%;background:var(--iguana);transition:width .2s}
.spacer{flex:1}
#wallet{padding:6px 12px;text-align:right;flex:none;line-height:1.1}
#wallet b{font-family:var(--font-num);font-weight:400;font-size:20px;color:var(--amber)}
#wallet span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
#wallet small{display:block;color:var(--muted);font-size:12px;font-weight:600}
#minimap{width:124px;height:124px;flex:none;border-radius:12px;border:1px solid var(--edge);background:var(--panel-deep);display:block}

#toast{position:absolute;top:31%;left:50%;transform:translateX(-50%);max-width:min(90vw,480px);padding:9px 16px;border-radius:10px;font-weight:700;font-size:17px;text-align:center;opacity:0;transition:opacity .25s;background:var(--panel);border:1px solid var(--edge)}
#toast.show{opacity:1}
#toast.good{color:var(--iguana)}#toast.warn{color:var(--amber)}#toast.bad{color:var(--danger)}
#warn{position:absolute;top:21%;left:50%;transform:translateX(-50%);padding:5px 16px;border-radius:8px;background:rgba(120,10,6,.85);border:1px solid var(--danger);color:#fff;font-weight:800;letter-spacing:.14em;font-size:17px;animation:blink .7s steps(2) infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.35}}

/* ---- dashboard ---- */
#panel{position:absolute;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dash{display:flex;gap:8px;align-items:center;padding:8px;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.throttle{position:relative;width:54px;height:128px;border-radius:10px;background:linear-gradient(90deg,#0d161d,#1c2a35 50%,#0d161d);border:1px solid var(--edge);touch-action:none;overflow:hidden;flex:none}
.tfill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,rgba(255,181,61,.10),rgba(255,181,61,.42))}
.tslot{position:absolute;left:50%;top:8px;bottom:8px;width:4px;margin-left:-2px;border-radius:2px;background:#05090c}
.thandle{position:absolute;left:5px;right:5px;bottom:0;height:28px;border-radius:6px;background:linear-gradient(#f0f4f6,#93a5b0);color:#13202a;font:15px var(--font-num);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.tlabel{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.start{width:64px;height:64px;border-radius:50%;border:3px solid #2a343b;background:radial-gradient(circle at 50% 38%,#ef5146,#8a1b16);color:#fff;font-weight:800;font-size:14px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.35);padding:0}
.start small{font-size:9px;letter-spacing:.1em;font-weight:700;opacity:.85}
.start.on{background:radial-gradient(circle at 50% 38%,#62d36d,#1d7a2c)}
.start.busy{background:radial-gradient(circle at 50% 38%,#ffc65c,#a8650d)}
.sw{min-width:62px;height:40px;padding:3px 8px;border-radius:9px;background:#0d171e;border:1px solid var(--edge);font-weight:700;letter-spacing:.07em;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sw .led{width:22px;height:4px;border-radius:2px;background:#2e3c46}
.sw.on .led{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.sw.red.on .led{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.sw small{font:11px var(--font-num);color:var(--amber);letter-spacing:0}
.gauge{width:86px;height:86px;flex:none;display:block}
.digi{display:grid;grid-template-columns:auto auto;gap:1px 10px;background:var(--panel-deep);border:1px solid var(--edge);border-radius:8px;padding:6px 9px;min-width:124px}
.digi label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;align-self:center}
.digi b{font:400 17px var(--font-num);color:var(--amber);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.digi b.nav{color:var(--nav)}
.switches{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.right{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#stick{width:134px;height:134px;border-radius:50%;position:relative;touch-action:none;flex:none;background:radial-gradient(circle,#1e2c37 0 58%,#111b22 59%);border:2px solid var(--edge);box-shadow:0 6px 18px rgba(0,0,0,.35)}
#stick::before,#stick::after{content:"";position:absolute;background:rgba(150,185,205,.18)}
#stick::before{left:50%;top:12px;bottom:12px;width:1px}
#stick::after{top:50%;left:12px;right:12px;height:1px}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5b6b76,#19232a);border:2px solid #8396a2;z-index:1;display:grid;place-items:center}
#knob svg{width:34px;height:34px;stroke:#cfdbe2;fill:none;stroke-width:3;stroke-linecap:round}
.sticklbl{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);pointer-events:none}
#action{position:relative;overflow:hidden;padding:11px 20px;border-radius:999px;border:none;background:var(--iguana);color:#0e1c07;font-weight:800;letter-spacing:.1em;font-size:16px;box-shadow:0 0 0 0 rgba(134,207,69,.6);animation:pulse 1.5s infinite;white-space:nowrap}
#action.pick{background:var(--nav);color:#06222a;animation-name:pulse2}
#action.drop{background:var(--fruit);color:#2a1100;animation-name:pulse3}
#action[disabled]{animation:none;opacity:.95}
#action .prog{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.45)}
#action span{position:relative}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(134,207,69,.6)}70%{box-shadow:0 0 0 14px rgba(134,207,69,0)}100%{box-shadow:0 0 0 0 rgba(134,207,69,0)}}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(79,209,232,.6)}70%{box-shadow:0 0 0 14px rgba(79,209,232,0)}100%{box-shadow:0 0 0 0 rgba(79,209,232,0)}}
@keyframes pulse3{0%{box-shadow:0 0 0 0 rgba(255,138,61,.6)}70%{box-shadow:0 0 0 14px rgba(255,138,61,0)}100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}}

/* ---- overlay ---- */
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(8,18,28,.45);z-index:10}
.card{width:min(100%,520px);max-height:100%;overflow:auto;padding:20px 22px;border-radius:16px;background:rgba(14,24,33,.95);border:1px solid var(--edge);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.card h1{margin:0;font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--iguana)}
.card h2{margin:0;font-size:30px;font-weight:800;text-wrap:balance}
.card h3{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.card .sub{margin:4px 0 14px;color:var(--amber);font-weight:700;letter-spacing:.12em;font-size:13px}
.card p{margin:0 0 12px;line-height:1.4;font-size:16px;color:#d3dfe6;max-width:62ch}
.card ol{margin:0 0 14px;padding-left:20px;line-height:1.4;font-size:15px;color:#d3dfe6;display:grid;gap:4px}
.card ol b{color:var(--ink)}
.board{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0 0 14px;font-size:15px;align-items:center}
.board .chip{justify-self:start}
.board span{color:#d3dfe6;min-width:0}
.board span b{color:var(--ink);font-weight:700}
.card .keys{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:16px}
.card .keys kbd{font:12px var(--font-num);padding:0 5px;border:1px solid var(--edge);border-radius:4px;color:var(--ink)}
.card .btns{display:flex;flex-wrap:wrap;gap:8px}
.cta{padding:12px 22px;border-radius:999px;border:none;background:var(--iguana);color:#0e1c07;font-weight:800;font-size:17px;letter-spacing:.08em}
.ghost{padding:11px 18px;border-radius:999px;border:1px solid var(--edge);background:transparent;font-weight:700;font-size:15px;letter-spacing:.05em}
.stats{display:flex;gap:18px;margin:0 0 14px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.stats b{display:block;font:20px var(--font-num);color:var(--amber);font-weight:400;letter-spacing:0}

@media (max-width:760px){
  #panel{flex-wrap:wrap;row-gap:8px}
  .center{order:-1;flex:1 1 100%;justify-content:center}
  .gauge{width:68px;height:68px}
  .digi{min-width:104px}.digi b{font-size:15px}
  #mission{flex-basis:auto;flex-grow:1}
  #wallet{display:none}
  #minimap{width:96px;height:96px}
}
@media (max-width:520px){ .att{display:none} .sw{min-width:52px} }
@media (max-height:460px){
  .gauge{width:68px;height:68px}
  .throttle{height:104px}
  #stick{width:110px;height:110px}
  #knob{width:48px;height:48px;margin:-24px 0 0 -24px}
  .start{width:52px;height:52px;font-size:12px}
  .sw{height:34px;min-width:54px;font-size:12px}
  .digi b{font-size:15px}
  .dash{padding:6px}
  #minimap{width:92px;height:92px}
  #mission{font-size:13px;padding:6px 10px}
  #mDesc{font-size:15px}
  #action{padding:9px 16px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){#action,#warn{animation:none}}
</style>
</head>
<body>


<canvas id="gl"></canvas>

<div id="hud">
  <div id="top">
    <button id="menuBtn" class="glass iconbtn" aria-label="Pausar"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
    <div id="mission" class="glass">
      <div class="mrow"><span id="mType" class="chip t-carga">CARGA</span><span id="mPay"></span></div>
      <div id="mDesc">—</div>
      <div id="mRoute">—</div>
      <div class="mrow"><svg id="mArrow" viewBox="0 0 24 24"><path d="M12 2l7 18-7-4-7 4z"/></svg><span id="mDist"></span><span id="mStatus"></span></div>
      <div id="welfare" hidden><span>BEM-ESTAR</span><div class="bar"><i id="welBar"></i></div><span id="welTxt">100%</span></div>
    </div>
    <div class="spacer"></div>
    <div id="wallet" class="glass"><span>R$</span> <b id="money">0</b><small id="deliv">0 missões</small></div>
    <canvas id="minimap" width="124" height="124"></canvas>
  </div>

  <div id="toast"></div>
  <div id="warn" hidden></div>

  <div id="panel">
    <div class="dash glass left">
      <div id="throttle" class="throttle" aria-label="Manete de potência">
        <div class="tfill" id="tfill"></div><div class="tslot"></div>
        <span class="tlabel">MANETE</span>
        <div class="thandle" id="thandle">0</div>
      </div>
      <div class="col">
        <button id="startBtn" class="start">START<small>MOTORES</small></button>
        <button id="brakeBtn" class="sw red on"><span>FREIO</span><i class="led"></i></button>
      </div>
    </div>

    <div class="dash glass center">
      <svg class="gauge" id="spd" viewBox="0 0 100 100" aria-label="Velocímetro"></svg>
      <svg class="gauge att" viewBox="-50 -50 100 100" aria-label="Horizonte artificial">
        <defs><clipPath id="attClip"><circle r="45"/></clipPath></defs>
        <circle r="49" fill="#0a1218" stroke="rgba(150,185,205,.35)"/>
        <g clip-path="url(#attClip)">
          <g id="horizon">
            <rect x="-160" y="-160" width="320" height="160" fill="#3f8fd0"/>
            <rect x="-160" y="0" width="320" height="160" fill="#8a5a2e"/>
            <line x1="-160" y1="0" x2="160" y2="0" stroke="#fff" stroke-width="1.2"/>
            <g stroke="#fff" stroke-width=".8">
              <line x1="-10" y1="-16" x2="10" y2="-16"/><line x1="-6" y1="-8" x2="6" y2="-8"/>
              <line x1="-10" y1="16" x2="10" y2="16"/><line x1="-6" y1="8" x2="6" y2="8"/>
              <line x1="-10" y1="-32" x2="10" y2="-32"/><line x1="-10" y1="32" x2="10" y2="32"/>
            </g>
          </g>
        </g>
        <path d="M-26 0h14l4 5 4-5h0M26 0h-14" stroke="#ffb53d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="2" fill="#ffb53d"/>
      </svg>
      <div class="digi">
        <label>ALT</label><b id="dAlt">0 ft</b>
        <label>V/S</label><b id="dVs">0</b>
        <label>RUMO</label><b id="dHdg" class="nav">000°</b>
        <label>PESO</label><b id="dMass">36 t</b>
      </div>
      <div class="switches">
        <button id="gearBtn" class="sw on"><span>TREM</span><i class="led"></i></button>
        <button id="flapBtn" class="sw"><span>FLAPS</span><small id="flapTxt">0</small></button>
        <button id="camBtn" class="sw"><span>CÂMERA</span><small id="camTxt">1</small></button>
        <button id="sndBtn" class="sw on"><span>SOM</span><i class="led"></i></button>
      </div>
    </div>

    <div class="right">
      <button id="action" hidden><i class="prog" id="actProg"></i><span id="actTxt">CARREGAR</span></button>
      <div id="stick" aria-label="Manche">
        <div id="knob"><svg viewBox="0 0 40 40"><path d="M6 14v8c0 3 2 5 5 5h18c3 0 5-2 5-5v-8M20 27v8"/></svg></div>
        <span class="sticklbl">MANCHE</span>
      </div>
    </div>
  </div>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
if(!window.THREE){ $('#card').innerHTML='<h2>Não foi possível carregar o motor 3D</h2><p>Verifique a conexão e abra a página de novo.</p>'; return; }

const DEG=Math.PI/180, G=9.81, RW_Y=0.25, GEAR_H=2.95+RW_Y, BELLY_H=2.15+RW_Y;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const dec1=n=>n.toFixed(1).replace('.',',');

/* ================== WORLD DATA ================== */
const AIRPORTS=[
  {id:'CEN',name:'Base Aérea Central',x:0,z:0,hdg:0,len:2000,kind:'carga'},
  {id:'VVD',name:'Vale Verde',x:-3300,z:9200,hdg:30,len:1700,kind:'frutas'},
  {id:'SRA',name:'Serra Alta',x:-9800,z:-5200,hdg:100,len:1800,kind:'carros'},
  {id:'IGU',name:'Ilha das Iguanas',x:13800,z:-2500,hdg:60,len:1500,kind:'iguanas'},
  {id:'COQ',name:'Porto Coqueiral',x:6700,z:9600,hdg:170,len:1800,kind:'urgente'},
].map(a=>{const h=a.hdg*DEG;return Object.assign(a,{w:45,dx:Math.sin(h),dz:-Math.cos(h),rx:Math.cos(h),rz:Math.sin(h)});});
const ISLAND={x:13800,z:-2500,r:1800};
const coastX=z=>9000+700*Math.sin(z/2600)+260*Math.sin(z/900+1);
function isWater(x,z){ if(x<coastX(z)) return false; const dx=x-ISLAND.x,dz=z-ISLAND.z; return dx*dx+dz*dz>ISLAND.r*ISLAND.r; }
function local(a,x,z){const rx=x-a.x,rz=z-a.z;return {along:rx*a.dx+rz*a.dz,across:rx*a.rx+rz*a.rz};}
function wpt(a,along,across){return [a.x+a.dx*along+a.rx*across, a.z+a.dz*along+a.rz*across];}
function onRunway(a,x,z){const l=local(a,x,z);return Math.abs(l.along)<a.len/2+20&&Math.abs(l.across)<a.w/2+3;}
function inAirport(a,x,z){const l=local(a,x,z);return Math.abs(l.along)<a.len/2+160&&l.across>-90&&l.across<270;}
function airportAt(x,z){for(let i=0;i<AIRPORTS.length;i++) if(inAirport(AIRPORTS[i],x,z)) return i; return -1;}
function nearAirport(x,z,pad){for(const a of AIRPORTS){const l=local(a,x,z); if(Math.abs(l.along)<a.len/2+pad&&Math.abs(l.across)<pad+260) return true;} return false;}
const distKm=(i,j)=>Math.hypot(AIRPORTS[i].x-AIRPORTS[j].x,AIRPORTS[i].z-AIRPORTS[j].z)/1000;

/* iguana colonies (targets for the fruit drops) */
const SITES=[

/* merge simple parts into one vertex-colored geometry: [geo, color, x,y,z, rotY] */
function mergeParts(parts){
  const pos=[],nor=[],col=[],c=new THREE.Color(),m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),one=new THREE.Vector3(1,1,1),v=new THREE.Vector3();
  for(const p of parts){
    const g=(p[0].index?p[0].toNonIndexed():p[0].clone());
    e.set(0,p[5]||0,0);q.setFromEuler(e);v.set(p[2]||0,p[3]||0,p[4]||0);m.compose(v,q,one);g.applyMatrix4(m);
    const pa=g.attributes.position.array,na=g.attributes.normal.array;
    for(let i=0;i<pa.length;i++){pos.push(pa[i]);nor.push(na[i]);}
    c.setHex(p[1]);for(let i=0;i<pa.length/3;i++) col.push(c.r,c.g,c.b);
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return out;
}

let AC=null,snd=null,muted=false;
function initAudio(){
  if(AC) {if(AC.state==='suspended') AC.resume(); return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;const eg=AC.createGain();eg.gain.value=0;lp.connect(eg);eg.connect(master);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),o3=AC.createOscillator();o1.type=o2.type='sawtooth';o3.type='triangle';o2.detune.value=16;
  [o1,o2,o3].forEach(o=>{o.connect(lp);o.start();});
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const n=AC.createBufferSource();n.buffer=buf;n.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=.5;const ng=AC.createGain();ng.gain.value=0;n.connect(bp);bp.connect(ng);ng.connect(master);n.start();
  snd={master,lp,eg,o1,o2,o3,ng};
}
function updAudio(){
  if(!snd) return;const t=AC.currentTime,r=avgRpm(),th=st.throttle;
  const f=30+r*(34+th*46);
  snd.o1.frequency.setTargetAtTime(f,t,.12);snd.o2.frequency.setTargetAtTime(f,t,.12);snd.o3.frequency.setTargetAtTime(f*2.02,t,.12);
  snd.eg.gain.setTargetAtTime(st.paused||st.crashed?0:r*(0.05+0.09*th),t,.15);
  snd.lp.frequency.setTargetAtTime(250+r*(450+th*1100),t,.2);
  snd.ng.gain.setTargetAtTime(st.paused||st.crashed?0:Math.min(0.14,st.speed/900),t,.3);
}
function beep(f,dur,type,vol){ if(!snd||muted) return; const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol||.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g);g.connect(snd.master);o.start();o.stop(AC.currentTime+dur+.05);}

function setMute(m){muted=m;if(snd) snd.master.gain.value=m?0:0.9;$('#sndBtn').classList.toggle('on',!m);}

const keys={};const joy={x:0,y:0};

/* ================== MISSION ACTIONS ================== */
function actionState(){
  if(!mission||st.crashed) return null;
  if(st.loading) return st.loading.mode;
  if(mission.type==='frutas'&&mission.loaded&&!st.onGround&&mission.crates>0) return 'drop';
  const here=airportAt(st.pos.x,st.pos.z);
  if(!st.onGround||st.speed>1.5) return null;
  if(!mission.loaded&&here===mission.from) return 'load';
  if(mission.loaded&&mission.type!=='frutas'&&here===mission.to) return 'unload';
  return null;
}
function doAction(){
  const a=actionState();if(!a||st.loading) return;
  if(a==='drop') return dropCrate();
  const n=LOADER[mission.type].length;
  st.loading={mode:a,t:0,dur:2.2+n*0.75};st.brake=true;
  const what={carga:'a carga',carros:'os jipes',iguanas:'as iguanas',frutas:'as frutas',urgente:'as vacinas'}[mission.type];
  toast((a==='load'?'Embarcando ':'Desembarcando ')+what+'…');
  beep(440,.1);
}
function finishLoading(){
  const mode=st.loading.mode;st.loading=null;hideLoader();
  if(mode==='load'){
    mission.loaded=true;
    if(mission.type==='iguanas'){mission.welfare=100;st.welfareWarned=false;}
    if(mission.type==='urgente') mission.elapsed=0;
    if(mission.type==='frutas') toast('Frutas a bordo! Voe até as colônias marcadas em laranja.','good');
    else if(mission.type==='urgente') toast(`Vacinas a bordo! Você tem ${Math.floor(mission.limit/60)}:${String(mission.limit%60).padStart(2,'0')} até ${AIRPORTS[mission.to].name}.`,'good');
    else toast(`Tudo a bordo! Decole para ${AIRPORTS[mission.to].name}.`,'good');
    beep(660,.15);
  }else{
    let pay=mission.base,extra='';
    if(mission.type==='iguanas'){pay=Math.round(pay*(0.4+0.6*mission.welfare/100)/10)*10;save.iguanas+=mission.qty;extra=` · iguanas ${Math.round(mission.welfare)}% bem`;}
    if(mission.type==='urgente'){const ok=mission.elapsed<=mission.limit;pay=Math.round(pay*(ok?1.3:0.5)/10)*10;extra=ok?' · no prazo, bônus de 30%':' · atrasado, metade do valor';}
    save.money+=pay;save.delivered++;persist();coin();
    toast(`Entrega feita! +R$ ${fmt(pay)}${extra}`,'good');
    mission=null;st.assignHold=3;
  }
}
const _v=new THREE.Vector3(),_a=new THREE.Vector3(),_b=new THREE.Vector3();
function updLoading(dt){
  const L=st.loading;if(!L) return;L.t+=dt;
  const T=L.t,D=L.dur;
  let r;
  if(T<0.9) r=RAMP_CLOSED+(RAMP_OPEN-RAMP_CLOSED)*(T/0.9); else if(T>D-0.9) r=RAMP_OPEN+(RAMP_CLOSED-RAMP_OPEN)*((T-(D-0.9))/0.9); else r=RAMP_OPEN;
  P.ramp.rotation.x=r;
  const items=LOADER[mission.type];
  const n=items.length,travel=mission.type==='carros'?2.0:1.8,span=D-1.8-travel,stag=span/Math.max(1,n-1);
  const gy=-(GEAR_H-RW_Y), spacing=mission.type==='carros'?6:4.2;
  for(let i=0;i<n;i++){
    const g=items[i];let p=clamp((T-0.9-i*stag)/travel,0,1);
    const loading=L.mode==='load';
    const q=loading?p:1-p;               // 0 = outside on the apron, 1 = inside the hold
    let lx,ly,lz;
    const ox=((i%3)-1)*spacing, oz=32+Math.floor(i/3)*7;
    if(q<0.72){const s=q/0.72;lx=ox*(1-s);lz=oz+(13.2-oz)*s;ly=gy;}
    else{const s=(q-0.72)/0.28;lx=0;lz=13.2+(4.5-13.2)*s;ly=gy+(-1.9-gy)*s;}
    _v.set(lx,ly,lz);plane.localToWorld(_v);
    g.visible=q<0.999&&(loading?p<1:p>0);
    if(mission.type==='iguanas'&&g.visible) _v.y+=Math.abs(Math.sin(T*10+i))*0.12;
    g.position.copy(_v);
    g.rotation.set(0,st.yaw+(loading?0:Math.PI),0);
  }
  if(T>=D) finishLoading();
}

/* fruit drops by parachute */
const DROPS=[];const FREE_T=1.4;
const chuteGeo=new THREE.SphereGeometry(5,14,6,0,Math.PI*2,0,Math.PI/2), chuteMat=lam(0xff8a3d,{side:THREE.DoubleSide,flatShading:true});
const cordGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-0.9,1.3,-0.9),new THREE.Vector3(-4.6,7,0),new THREE.Vector3(0.9,1.3,-0.9),new THREE.Vector3(0,7,-4.6),
  new THREE.Vector3(0.9,1.3,0.9),new THREE.Vector3(4.6,7,0),new THREE.Vector3(-0.9,1.3,0.9),new THREE.Vector3(0,7,4.6)]);
const cordMat=new THREE.LineBasicMaterial({color:0x333333});
function dropStep(s,dt){
  s.t+=dt;if(!s.chute&&s.t>FREE_T) s.chute=true;
  if(s.chute){s.vy+=(-7-s.vy)*Math.min(1,dt*1.8);const k=Math.exp(-0.55*dt);s.vx*=k;s.vz*=k;}
  else{s.vy-=G*dt;const k=Math.exp(-0.05*dt);s.vx*=k;s.vz*=k;}
  s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
}
function dropStart(){_a.set(0,-1.2,12.5);plane.localToWorld(_a);return {x:_a.x,y:_a.y,z:_a.z,vx:st.vel.x,vy:st.vel.y,vz:st.vel.z,t:0,chute:false};}
function predictImpact(){const s=dropStart();for(let i=0;i<2000&&s.y>0.3;i++) dropStep(s,0.1);return s;}
function dropCrate(){
  if(st.dropCD>0||!mission||mission.crates<=0) return;
  st.dropCD=1.3;st.dropRamp=2.6;mission.crates--;mission.mass=+(mission.crates*0.8).toFixed(1);
  const s=dropStart();
  const g=new THREE.Group();const box=new THREE.Mesh(FRUIT_GEO,VC);g.add(box);
  const chute=new THREE.Group();chute.add(new THREE.Mesh(chuteGeo,chuteMat));const c2=new THREE.Mesh(chuteGeo,chuteMat);chute.add(c2);
  chute.children[0].position.y=7;c2.position.y=7;c2.scale.set(.5,.5,.5);c2.position.y=9.6;
  chute.add(new THREE.LineSegments(cordGeo,cordMat));chute.scale.setScalar(0.05);chute.visible=false;g.add(chute);
  g.position.set(s.x,s.y,s.z);scene.add(g);
  DROPS.push({s,g,chute,landed:false,life:30});
  beep(180,.35,'triangle',.08);
  toast(`Caixa solta! Restam ${mission.crates}.`);
}
function updDrops(dt){
  for(let i=DROPS.length-1;i>=0;i--){
    const d=DROPS[i];
    if(!d.landed){
      dropStep(d.s,dt);
      if(d.s.chute){d.chute.visible=true;d.chute.scale.setScalar(Math.min(1,d.chute.scale.x+dt*1.6));}
      d.g.position.set(d.s.x,Math.max(d.s.y,0.2),d.s.z);
      d.g.rotation.y+=dt*0.4;
      if(d.s.y<=0.2){d.landed=true;landCrate(d);}
    }else{
      d.life-=dt;d.chute.scale.y=Math.max(0.05,d.chute.scale.y-dt*0.8);d.chute.position.y=Math.max(-4,d.chute.position.y-dt*3);
      if(d.life<=0){scene.remove(d.g);DROPS.splice(i,1);}
    }
  }
}
function landCrate(d){
  const x=d.s.x,z=d.s.z;
  if(!mission||mission.type!=='frutas') return;
  if(isWater(x,z)){d.life=0.5;toast('A caixa caiu no mar!','bad');beep(150,.3,'sawtooth');return checkFruitEnd();}
  if(!d.chute.visible){toast('A caixa se espatifou: solte acima de 40 m para o paraquedas abrir.','bad');d.g.children[0].scale.set(1.4,0.3,1.4);beep(120,.3,'sawtooth');return checkFruitEnd();}
  let best=-1,bd=1e9;
  for(const i of pendingTargets()){const s=SITES[i],dd=Math.hypot(x-s.x,z-s.z);if(dd<bd){bd=dd;best=i;}}
  if(best>=0&&bd<=170){
    const full=bd<=70,pay=Math.round(mission.perHit*(full?1:0.6)/10)*10;
    mission.done.push(best);mission.earned+=pay;mission.hits++;save.money+=pay;persist();coin();
    toast(`${full?'Na mosca!':'Perto do alvo.'} ${SITES[best].name} recebeu as frutas · +R$ ${fmt(pay)}`,'good');
    SITES[best].ring.visible=SITES[best].beam.visible=false;
    SITE_IGS.forEach(g=>{if(g.site===best){const a=Math.random()*6.28,r=3+Math.random()*3;g.tx=x+Math.cos(a)*r;g.tz=z+Math.sin(a)*r;}});
  }else{
    toast(best>=0?`Errou ${SITES[best].name} por ${fmt(bd)} m. Solte quando o X amarelo estiver no alvo.`:'Caixa fora do alvo.','warn');
  }
  checkFruitEnd();
}
function checkFruitEnd(){
  if(!mission||mission.type!=='frutas') return;
  const left=pendingTargets().length, inAir=DROPS.some(d=>!d.landed);
  if(left===0||(mission.crates===0&&!inAir)){
    save.delivered++;persist();
    const m=mission;mission=null;st.assignHold=0;
    setTimeout(()=>toast(`Missão de frutas encerrada: ${m.hits}/3 colônias, R$ ${fmt(m.earned)}. Pouse em qualquer aeroporto para a próxima missão.`,m.hits?'good':'warn'),1800);
  }
}

/* ================== SIMULATION ================== */
function step(dt){
  if(st.engine==='starting'){st.engineT+=dt;for(let i=0;i<4;i++) if(st.engineT>i*0.9) st.rpm[i]=Math.min(1,st.rpm[i]+dt*0.75);
    if(st.rpm.every(r=>r>=1)){st.engine='on';toast(st.brake?'Motores ligados. Solte o FREIO e empurre a manete.':'Motores ligados!','good');}}
  else if(st.engine==='off'){for(let i=0;i<4;i++) st.rpm[i]=Math.max(0,st.rpm[i]-dt*0.3);}
  const rpm=st.engine==='on'?1:(st.engine==='starting'?avgRpm()*0.3:0);
  st.dropCD=Math.max(0,st.dropCD-dt);st.dropRamp=Math.max(0,st.dropRamp-dt);st.assignHold=Math.max(0,st.assignHold-dt);

  let inP=joy.y,inR=joy.x,inY=0;
  if(keys.ArrowDown) inP+=1; if(keys.ArrowUp) inP-=1;
  if(keys.ArrowRight) inR+=1; if(keys.ArrowLeft) inR-=1;
  if(keys.KeyD) inY+=1; if(keys.KeyA) inY-=1;
  if(keys.KeyW||keys.ShiftLeft) st.throttle=Math.min(1,st.throttle+dt*0.5);
  if(keys.KeyS||keys.ControlLeft) st.throttle=Math.max(0,st.throttle-dt*0.5);
  inP=clamp(inP,-1,1);inR=clamp(inR,-1,1);

  g.fillStyle='#2d4a2a';g.fillRect(0,0,S,S);
  g.fillStyle='#1d5a82';g.beginPath();g.moveTo(S,0);for(let i=0;i<=60;i++){const z=MM.Z0+MM.SPAN*i/60;g.lineTo(tx(coastX(z)),tz(z));}g.lineTo(S,S);g.closePath();g.fill();
  g.fillStyle='#2d4a2a';g.beginPath();g.arc(tx(ISLAND.x),tz(ISLAND.z),ISLAND.r/MM.SPAN*S,0,7);g.fill();
  g.fillStyle='#55603f';for(const h of HILLS){g.beginPath();g.arc(tx(h.x),tz(h.z),Math.max(1.5,h.r/MM.SPAN*S),0,7);g.fill();}
  g.fillStyle='#9fd46a';for(const s of SITES){g.beginPath();g.arc(tx(s.x),tz(s.z),1.6*dpr,0,7);g.fill();}
  g.lineWidth=Math.max(2,2*dpr);g.lineCap='round';
  g.font=`700 ${9*dpr}px Saira Condensed,sans-serif`;g.textAlign='center';
  for(const a of AIRPORTS){const [x1,z1]=wpt(a,-a.len/2,0),[x2,z2]=wpt(a,a.len/2,0);g.strokeStyle='#d8e2e8';g.beginPath();g.moveTo(tx(x1),tz(z1));g.lineTo(tx(x2),tz(z2));g.stroke();
    g.fillStyle=TCOLOR[a.kind];g.fillText(a.id,tx(a.x),tz(a.z)+11*dpr);}
  MM.S=S;MM.dpr=dpr;
}
function mmDraw(){
  const g=mmCanvas.getContext('2d'),S=MM.S,dpr=MM.dpr;g.clearRect(0,0,S,S);g.drawImage(mmBg,0,0);
  const tx=x=>(x-MM.X0)/MM.SPAN*S,tz=z=>(z-MM.Z0)/MM.SPAN*S;
  const ring=(x,z,c)=>{g.strokeStyle=c;g.lineWidth=2*dpr;g.beginPath();g.arc(tx(x),tz(z),(6+2*Math.sin(time*4))*dpr,0,7);g.stroke();};
  if(mission){
    if(mission.type==='frutas'&&mission.loaded) for(const i of pendingTargets()) ring(SITES[i].x,SITES[i].z,'#ff8a3d');
    else{const a=AIRPORTS[mission.loaded?mission.to:mission.from];ring(a.x,a.z,mission.loaded?'#86cf45':'#4fd1e8');}
  }
  g.save();g.translate(clamp(tx(st.pos.x),4,S-4),clamp(tz(st.pos.z),4,S-4));g.rotate(-st.yaw);
  g.fillStyle='#ffb53d';g.strokeStyle='#0a1218';g.lineWidth=1.2*dpr;g.beginPath();g.moveTo(0,-7*dpr);g.lineTo(5*dpr,6*dpr);g.lineTo(0,3.5*dpr);g.lineTo(-5*dpr,6*dpr);g.closePath();g.fill();g.stroke();g.restore();
}

let toastT=null;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>{t.className='';},3400);}

/* ================== OVERLAYS ================== */
function showCard(html){$('#card').innerHTML=html;$('#overlay').hidden=false;}
function hideCard(){$('#overlay').hidden=true;}
function resume(){hideCard();st.paused=false;initAudio();}
const BOARD='<h3>MISSÕES DE CADA AEROPORTO</h3><div class="board">'+AIRPORTS.map(a=>`${chipHTML(a.kind)}<span><b>${a.name}</b> · ${TYPES[a.kind].name}</span>`).join('')+'</div>';
const HOWTO=`<ol>
  <li><b>START</b> liga os quatro motores. Pare no pátio de qualquer aeroporto para receber a missão dele e toque em <b>CARREGAR</b>.</li>
  <li>Solte o <b>FREIO</b>, empurre a <b>MANETE</b> até o fim e, passando da marca vermelha do velocímetro, puxe o <b>MANCHE</b> para baixo para subir.</li>
  <li>Siga a seta e o feixe de luz. Pouse com <b>TREM</b> baixado, <b>FLAPS</b> 30°, asas niveladas e descida lenta; pare e toque em <b>DESCARREGAR</b>.</li>
  <li><b>Frutas:</b> voe sobre as colônias marcadas em laranja e toque em <b>SOLTAR</b> quando o X amarelo no chão estiver dentro do círculo. Solte acima de 40 m.</li>
  <li><b>Iguanas:</b> curvas fechadas e trancos deixam as iguanas enjoadas e baixam o pagamento. <b>Vacinas:</b> entregue antes do prazo para ganhar bônus.</li>
  <li>Arraste o dedo na tela, fora dos controles, para girar a câmera em volta do avião. Dois dedos ou a roda do mouse mudam o zoom.</li>
</ol>
<div class="keys">Teclado: <kbd>W</kbd>/<kbd>S</kbd> manete · <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> manche · <kbd>A</kbd>/<kbd>D</kbd> leme · <kbd>E</kbd> motores · <kbd>B</kbd> freio · <kbd>G</kbd> trem · <kbd>F</kbd> flaps · <kbd>C</kbd> câmera · <kbd>Q</kbd>/<kbd>R</kbd> girar câmera · <kbd>Espaço</kbd> carregar ou soltar · <kbd>P</kbd> pausa</div>`;
function showIntro(){
  st.paused=true;
  showCard(`<h1>Rota das <em>Iguanas</em></h1><p class="sub">PILOTO DE C-130 HÉRCULES</p>
    <p>Cinco aeroportos, cinco tipos de missão: carga, jipes, iguanas, frutas lançadas de paraquedas e vacinas contra o relógio.</p>
    ${save.delivered?`<div class="stats"><span>CAIXA<b>R$ ${fmt(save.money)}</b></span><span>MISSÕES<b>${save.delivered}</b></span><span>IGUANAS<b>${save.iguanas}</b></span></div>`:''}
    ${BOARD}${HOWTO}
    <div class="btns"><button class="cta" id="go">Começar voo</button></div>
    <p style="margin:12px 0 0;font-size:13px;color:var(--muted)">No celular, jogue com a tela deitada.</p>`);
  $('#go').onclick=()=>{initAudio();resume();toast('Toque em START para ligar os motores. Arraste a tela para girar a câmera.');};
}
function showPause(){
  st.paused=true;
  const canNew=mission&&!mission.loaded&&!st.loading;
  showCard(`<h2>Pausa</h2><p class="sub">${mission?mission.desc.toUpperCase():'SEM MISSÃO'}</p>
    <div class="btns" style="margin-bottom:14px">
      <button class="cta" id="cont">Continuar</button>
      ${canNew?'<button class="ghost" id="newm">Sortear outro destino</button>':''}
      <button class="ghost" id="reset">Voltar à cabeceira</button>
      <button class="ghost" id="snd">${muted?'Ligar som':'Desligar som'}</button>
    </div>${BOARD}${HOWTO}`);
  $('#cont').onclick=resume;
  if(canNew) $('#newm').onclick=()=>{assignMission(mission.from);resume();toast(`Nova missão: ${mission.desc}`);};
  $('#reset').onclick=()=>{const eng=st.engine;placeAt(st.lastAirport);st.engine=eng==='off'?'off':'on';if(st.engine==='on') st.rpm=[1,1,1,1];shadow.visible=true;resume();};
  $('#snd').onclick=()=>{initAudio();setMute(!muted);showPause();};
}

/* ================== LOOP ================== */
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?72:60;camera.updateProjectionMatrix();mmSetup();}
window.addEventListener('resize',resize);

assignMission(0);
placeAt(0);resize();showIntro();
let last=performance.now(),mmT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!st.paused&&!st.crashed){step(dt);updLoading(dt);}
  if(!st.paused){updDrops(dt);updSiteIguanas(dt,false);}
  updFX(dt);updVisuals(dt);updCamera(dt);updHUD(dt);updAudio();
  mmT+=dt;if(mmT>0.08){mmT=0;mmDraw();}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!st.paused&&!st.crashed) showPause();});
})();
</script>
